name: GLPI GMUD (Self Hosted)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gmud:
    runs-on: [self-hosted, glpi, lan]

    env:
      GLPI_API_BASE: ${{ secrets.GLPI_API_BASE }}
      APP_TOKEN: ${{ secrets.GLPI_APP_TOKEN }}
      USER_TOKEN: ${{ secrets.GLPI_USER_TOKEN }}
      CATEGORY_ID: ${{ secrets.GLPI_CHANGE_CATEGORY_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Show runner info
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner Name: $RUNNER_NAME"
          echo "Runner OS: $RUNNER_OS"
          uname -a || true
          echo "GLPI_API_BASE (secret): ${GLPI_API_BASE:-<empty>}"

      - name: Normalize GLPI API URL
        id: base
        shell: bash
        run: |
          set -euo pipefail
          base="${GLPI_API_BASE%/}"
          if [[ "$base" != *"/apirest.php" ]]; then
            base="${base}/apirest.php"
          fi
          echo "GLPI_BASE=$base" >> "$GITHUB_OUTPUT"
          echo "Using GLPI_BASE=$base"

      - name: Test GLPI connectivity
        shell: bash
        env:
          GLPI_BASE: ${{ steps.base.outputs.GLPI_BASE }}
        run: |
          set -euo pipefail
          echo "Testing access to GLPI endpoint..."
          # testa /apirest.php (mais relevante do que /)
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" \
            --connect-timeout 5 --max-time 10 \
            "${GLPI_BASE}/" || exit 1

      - name: Install jq if needed
        shell: bash
        run: |
          set -euo pipefail
          if command -v jq >/dev/null 2>&1; then
            echo "jq already installed"
            exit 0
          fi

          echo "jq not found. Installing..."
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y jq
          elif command -v dnf >/dev/null 2>&1; then
            sudo dnf install -y jq
          elif command -v yum >/dev/null 2>&1; then
            sudo yum install -y jq
          else
            echo "No supported package manager found (apt/dnf/yum). Install jq manually on the runner."
            exit 1
          fi

      - name: Init GLPI Session
        id: session
        shell: bash
        env:
          GLPI_BASE: ${{ steps.base.outputs.GLPI_BASE }}
        run: |
          set -euo pipefail

          resp=$(curl -sS -w "\n%{http_code}" \
            -X GET \
            -H "Content-Type: application/json" \
            -H "App-Token: ${APP_TOKEN}" \
            -H "Authorization: user_token ${USER_TOKEN}" \
            "${GLPI_BASE}/initSession")

          body="$(echo "$resp" | sed '$d')"
          code="$(echo "$resp" | tail -n1)"

          echo "HTTP: $code"

          session="$(echo "$body" | jq -r '.session_token // empty' 2>/dev/null || true)"

          if [[ -z "$session" ]]; then
            echo "Erro ao iniciar sessão (GLPI initSession). Resposta:"
            echo "$body"
            exit 1
          fi

          echo "SESSION_TOKEN=$session" >> "$GITHUB_OUTPUT"

      - name: Create Change in GLPI
        id: change
        shell: bash
        env:
          GLPI_BASE: ${{ steps.base.outputs.GLPI_BASE }}
          SESSION_TOKEN: ${{ steps.session.outputs.SESSION_TOKEN }}
        run: |
          set -euo pipefail

          TITLE="[GMUD] ${GITHUB_REPOSITORY} - ${GITHUB_SHA:0:7}"
          BODY="Criado automaticamente pelo GitHub Actions"

          PAYLOAD=$(jq -n \
            --arg name "$TITLE" \
            --arg content "$BODY" \
            --argjson itilcategories_id "${CATEGORY_ID}" \
            '{input:{name:$name, content:$content, itilcategories_id:$itilcategories_id}}')

          resp=$(curl -sS -w "\n%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Session-Token: ${SESSION_TOKEN}" \
            -H "App-Token: ${APP_TOKEN}" \
            -d "${PAYLOAD}" \
            "${GLPI_BASE}/Change")

          body="$(echo "$resp" | sed '$d')"
          code="$(echo "$resp" | tail -n1)"

          echo "HTTP: $code"

          change_id="$(echo "$body" | jq -r '.id // empty' 2>/dev/null || true)"

          if [[ -z "$change_id" ]]; then
            echo "Erro ao criar Change. Resposta:"
            echo "$body"
            exit 1
          fi

          echo "Change criado com ID: $change_id"
          echo "CHANGE_ID=$change_id" >> "$GITHUB_OUTPUT"

      - name: Kill GLPI Session
        if: always()
        shell: bash
        env:
          GLPI_BASE: ${{ steps.base.outputs.GLPI_BASE }}
          SESSION_TOKEN: ${{ steps.session.outputs.SESSION_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${SESSION_TOKEN:-}" ]]; then
            echo "Sem SESSION_TOKEN para matar sessão (provavelmente initSession falhou)."
            exit 0
          fi

          curl -sS -X GET \
            -H "Session-Token: ${SESSION_TOKEN}" \
            -H "App-Token: ${APP_TOKEN}" \
            "${GLPI_BASE}/killSession" >/dev/null || true
