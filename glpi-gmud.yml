name: GLPI GMUD (Auditoria)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      real_glpi:
        description: "Criar GMUD no GLPI (true = REAL, false = simulação)"
        required: true
        default: "false"

permissions:
  contents: read

jobs:
  gmud_open_and_validate:
    runs-on: ubuntu-latest
    outputs:
      change_id: ${{ steps.create_change.outputs.CHANGE_ID }}

    env:
      # push no main = REAL
      # pull_request = DRY
      # workflow_dispatch = DRY por padrão, pode forçar REAL com input real_glpi=true
      DRY_RUN: ${{ github.event_name != 'push' && github.event.inputs.real_glpi != 'true' }}

      GLPI_API_BASE: ${{ secrets.GLPI_API_BASE }}
      APP_TOKEN: ${{ secrets.GLPI_APP_TOKEN }}
      USER_TOKEN: ${{ secrets.GLPI_USER_TOKEN }}
      CATEGORY_ID: ${{ secrets.GLPI_CHANGE_CATEGORY_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Ensure jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Show context
        shell: bash
        run: |
          set -euo pipefail
          echo "event_name=${GITHUB_EVENT_NAME}"
          echo "DRY_RUN=${DRY_RUN}"
          echo "repo=${GITHUB_REPOSITORY}"
          echo "ref=${GITHUB_REF}"
          echo "sha=${GITHUB_SHA}"

      - name: Validate required secrets (when REAL)
        if: env.DRY_RUN != 'true'
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for v in GLPI_API_BASE APP_TOKEN USER_TOKEN; do
            if [[ -z "${!v:-}" ]]; then
              echo "FALTANDO secret/var: $v"
              missing=1
            fi
          done
          if [[ "$missing" -eq 1 ]]; then
            echo "Ajuste seus secrets em Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Normalize GLPI_API_BASE
        id: glpi_base
        shell: bash
        run: |
          set -euo pipefail
          base="${GLPI_API_BASE:-}"
          # remove trailing slash
          base="${base%/}"

          # Se o usuário passou a URL do GLPI (ex: https://glpi.dominio.com),
          # adiciona /apirest.php automaticamente.
          if [[ "$base" != *"/apirest.php" ]]; then
            base="${base}/apirest.php"
          fi

          echo "GLPI_BASE=${base}" >> "$GITHUB_OUTPUT"
          echo "Using GLPI API base: ${base}"

      - name: Compute ref name
        id: ref
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${GITHUB_HEAD_REF:-}" ]]; then
            echo "ref_name=${GITHUB_HEAD_REF}" >> "$GITHUB_OUTPUT"
          else
            echo "ref_name=${GITHUB_REF##*/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Init GLPI session
        if: env.DRY_RUN != 'true'
        id: glpi_session
        shell: bash
        env:
          GLPI_BASE: ${{ steps.glpi_base.outputs.GLPI_BASE }}
        run: |
          set -euo pipefail

          echo "InitSession: ${GLPI_BASE}/initSession"

          resp=$(curl -sS -w "\n%{http_code}" \
            -X GET \
            -H "Content-Type: application/json" \
            -H "App-Token: ${APP_TOKEN}" \
            -H "Authorization: user_token ${USER_TOKEN}" \
            "${GLPI_BASE}/initSession")

          body=$(echo "$resp" | sed '$d')
          code=$(echo "$resp" | tail -n1)

          echo "initSession http_code=${code}"

          session=$(echo "$body" | jq -r '.session_token // empty' 2>/dev/null || true)
          if [[ -z "${session}" ]]; then
            echo "ERRO initSession (http ${code})"
            echo "Body:"
            echo "$body"
            exit 1
          fi

          echo "SESSION_TOKEN=${session}" >> "$GITHUB_OUTPUT"

      - name: Create Change (DRY/REAL)
        id: create_change
        shell: bash
        env:
          GLPI_BASE: ${{ steps.glpi_base.outputs.GLPI_BASE }}
          SESSION_TOKEN: ${{ steps.glpi_session.outputs.SESSION_TOKEN }}
        run: |
          set -euo pipefail

          REF="${{ steps.ref.outputs.ref_name }}"
          echo "DRY_RUN=${DRY_RUN}"

          if [[ "${DRY_RUN}" == "true" ]]; then
            echo "Simulando criação de GMUD (sem GLPI)"
            echo "Repo: ${GITHUB_REPOSITORY}"
            echo "Ref: ${REF}"
            echo "CHANGE_ID=TEST-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TITLE="[GMUD][GITHUB] ${GITHUB_REPOSITORY} - ${REF} - ${GITHUB_SHA:0:7}"
          BODY="GMUD criada automaticamente pelo GitHub Actions.\nRun: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          if [[ -n "${CATEGORY_ID:-}" ]]; then
            # CATEGORY_ID deve ser número. Se vier string, jq --argjson pode falhar.
            # Vamos garantir número:
            if ! [[ "${CATEGORY_ID}" =~ ^[0-9]+$ ]]; then
              echo "CATEGORY_ID não é numérico: '${CATEGORY_ID}'. Ajuste o secret GLPI_CHANGE_CATEGORY_ID."
              exit 1
            fi
            PAYLOAD=$(jq -n \
              --arg name "$TITLE" \
              --arg content "$BODY" \
              --argjson itilcategories_id "${CATEGORY_ID}" \
              '{input:{name:$name, content:$content, itilcategories_id:$itilcategories_id}}')
          else
            PAYLOAD=$(jq -n --arg name "$TITLE" --arg content "$BODY" \
              '{input:{name:$name, content:$content}}')
          fi

          echo "POST Change: ${GLPI_BASE}/Change"
          resp=$(curl -sS -w "\n%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Session-Token: ${SESSION_TOKEN}" \
            -H "App-Token: ${APP_TOKEN}" \
            -d "${PAYLOAD}" \
            "${GLPI_BASE}/Change")

          body=$(echo "$resp" | sed '$d')
          code=$(echo "$resp" | tail -n1)

          echo "createChange http_code=${code}"

          # GLPI costuma devolver {"id":123} ou {"ids":[123]}
          CHANGE_ID=$(echo "$body" | jq -r '.id // .ids[0] // empty' 2>/dev/null || true)
          if [[ -z "${CHANGE_ID}" ]]; then
            echo "ERRO create Change (http ${code})"
            echo "Body:"
            echo "$body"
            exit 1
          fi

          echo "Change criado no GLPI com ID: ${CHANGE_ID}"
          echo "CHANGE_ID=${CHANGE_ID}" >> "$GITHUB_OUTPUT"

      - name: Validation (placeholder)
        shell: bash
        run: |
          set -euo pipefail
          echo "Executar testes/build/scans aqui..."

      - name: Kill GLPI session
        if: always() && env.DRY_RUN != 'true'
        shell: bash
        env:
          GLPI_BASE: ${{ steps.glpi_base.outputs.GLPI_BASE }}
          SESSION_TOKEN: ${{ steps.glpi_session.outputs.SESSION_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "${SESSION_TOKEN:-}" ]]; then
            echo "killSession: ${GLPI_BASE}/killSession"
            curl -sS -X GET \
              -H "Session-Token: ${SESSION_TOKEN}" \
              -H "App-Token: ${APP_TOKEN}" \
              "${GLPI_BASE}/killSession" >/dev/null || true
          fi

  deploy_with_approval:
    needs: [gmud_open_and_validate]
    runs-on: ubuntu-latest
    environment: production
    env:
      DRY_RUN: ${{ github.event_name != 'push' && github.event.inputs.real_glpi != 'true' }}
      CHANGE_ID: ${{ needs.gmud_open_and_validate.outputs.change_id }}

    steps:
      - uses: actions/checkout@v4

      - name: Deploy (placeholder)
        shell: bash
        run: |
          set -euo pipefail
          echo "DRY_RUN=${DRY_RUN}"
          echo "CHANGE_ID=${CHANGE_ID}"
          echo "Execute seu deploy aqui..."
