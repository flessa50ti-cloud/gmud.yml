name: GLPI GMUD (Self Hosted)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gmud:
    runs-on: self-hosted

    env:
      GLPI_API_BASE: ${{ secrets.GLPI_API_BASE }}
      APP_TOKEN: ${{ secrets.GLPI_APP_TOKEN }}
      USER_TOKEN: ${{ secrets.GLPI_USER_TOKEN }}
      CATEGORY_ID: ${{ secrets.GLPI_CHANGE_CATEGORY_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Show runner info
        shell: bash
        run: |
          echo "Runner Name: $RUNNER_NAME"
          echo "Runner OS: $RUNNER_OS"
          uname -a || true

      - name: Test GLPI connectivity
        shell: bash
        run: |
          set -e
          echo "Testing access to GLPI..."
          curl -I --connect-timeout 5 --max-time 10 http://192.168.0.44/ || exit 1

      - name: Install jq if needed
        shell: bash
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y jq
          fi

      - name: Normalize GLPI API URL
        id: base
        shell: bash
        run: |
          base="${GLPI_API_BASE%/}"
          if [[ "$base" != *"/apirest.php" ]]; then
            base="${base}/apirest.php"
          fi
          echo "GLPI_BASE=$base" >> $GITHUB_OUTPUT

      - name: Init GLPI Session
        id: session
        shell: bash
        env:
          GLPI_BASE: ${{ steps.base.outputs.GLPI_BASE }}
        run: |
          set -e

          resp=$(curl -sS -w "\n%{http_code}" \
            -X GET \
            -H "App-Token: ${APP_TOKEN}" \
            -H "Authorization: user_token ${USER_TOKEN}" \
            "${GLPI_BASE}/initSession")

          body=$(echo "$resp" | sed '$d')
          code=$(echo "$resp" | tail -n1)

          echo "HTTP: $code"

          session=$(echo "$body" | jq -r '.session_token // empty')

          if [[ -z "$session" ]]; then
            echo "Erro ao iniciar sessão"
            echo "$body"
            exit 1
          fi

          echo "SESSION_TOKEN=$session" >> $GITHUB_OUTPUT

      - name: Create Change in GLPI
        id: change
        shell: bash
        env:
          GLPI_BASE: ${{ steps.base.outputs.GLPI_BASE }}
          SESSION_TOKEN: ${{ steps.session.outputs.SESSION_TOKEN }}
        run: |
          set -e

          TITLE="[GMUD] ${GITHUB_REPOSITORY} - ${GITHUB_SHA:0:7}"
          BODY="Criado automaticamente pelo GitHub Actions"

          PAYLOAD=$(jq -n \
            --arg name "$TITLE" \
            --arg content "$BODY" \
            --argjson itilcategories_id "${CATEGORY_ID}" \
            '{input:{name:$name, content:$content, itilcategories_id:$itilcategories_id}}')

          resp=$(curl -sS -w "\n%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Session-Token: ${SESSION_TOKEN}" \
            -H "App-Token: ${APP_TOKEN}" \
            -d "${PAYLOAD}" \
            "${GLPI_BASE}/Change")

          body=$(echo "$resp" | sed '$d')
          code=$(echo "$resp" | tail -n1)

          echo "HTTP: $code"

          id=$(echo "$body" | jq -r '.id // empty')

          if [[ -z "$id" ]]; then
            echo "Erro ao criar Change"
            echo "$body"
            exit 1
          fi

          echo "Change criado com ID: $id"

      - name: Kill GLPI Session
        if: always()
        shell: bash
        env:
          GLPI_BASE: ${{ steps.base.outputs.GLPI_BASE }}
          SESSION_TOKEN: ${{ steps.session.outputs.SESSION_TOKEN }}
        run: |
          curl -sS -X GET \
            -H "Session-Token: ${SESSION_TOKEN}" \
            -H "App-Token: ${APP_TOKEN}" \
            "${GLPI_BASE}/killSession" >/dev/null || true
