name: GLPI GMUD (Self Hosted)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gmud:
    runs-on: [self-hosted, Linux, X64]

    env:
      GLPI_API_BASE: ${{ secrets.GLPI_API_BASE }}
      APP_TOKEN: ${{ secrets.GLPI_APP_TOKEN }}
      USER_TOKEN: ${{ secrets.GLPI_USER_TOKEN }}
      CATEGORY_ID: ${{ secrets.GLPI_CHANGE_CATEGORY_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Init GLPI Session
        id: session
        shell: bash
        run: |
          set -euo pipefail

          echo "Iniciando sessão no GLPI..."

          RESPONSE=$(curl -sS --connect-timeout 5 --max-time 20 -w "\n%{http_code}" \
            -X GET \
            -H "Content-Type: application/json" \
            -H "App-Token: ${APP_TOKEN}" \
            -H "Authorization: user_token ${USER_TOKEN}" \
            "${GLPI_API_BASE%/}/initSession")

          BODY=$(echo "$RESPONSE" | sed '$d')
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)

          echo "HTTP: $HTTP_CODE"

          SESSION_TOKEN=$(echo "$BODY" | jq -r '.session_token // empty' 2>/dev/null || true)

          if [[ -z "$SESSION_TOKEN" ]]; then
            echo "Erro ao iniciar sessão:"
            echo "$BODY"
            exit 1
          fi

          echo "SESSION_TOKEN=$SESSION_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Create Change in GLPI
        id: change
        shell: bash
        env:
          SESSION_TOKEN: ${{ steps.session.outputs.SESSION_TOKEN }}
        run: |
          set -euo pipefail

          echo "Criando Change no GLPI..."

          TITLE="[GMUD] ${GITHUB_REPOSITORY} - ${GITHUB_SHA:0:7}"
          BODY="Mudança criada automaticamente via GitHub Actions"

          PAYLOAD=$(jq -n \
            --arg name "$TITLE" \
            --arg content "$BODY" \
            --argjson itilcategories_id "${CATEGORY_ID}" \
            '{input:{name:$name, content:$content, itilcategories_id:$itilcategories_id}}')

          RESPONSE=$(curl -sS --connect-timeout 5 --max-time 20 -w "\n%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Session-Token: ${SESSION_TOKEN}" \
            -H "App-Token: ${APP_TOKEN}" \
            -d "${PAYLOAD}" \
            "${GLPI_API_BASE%/}/Change")

          BODY=$(echo "$RESPONSE" | sed '$d')
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)

          echo "HTTP: $HTTP_CODE"

          CHANGE_ID=$(echo "$BODY" | jq -r '.id // empty' 2>/dev/null || true)

          if [[ -z "$CHANGE_ID" ]]; then
            echo "Erro ao criar Change:"
            echo "$BODY"
            exit 1
          fi

          echo "Change criado com ID: $CHANGE_ID"

      - name: Kill GLPI Session
        if: always()
        shell: bash
        env:
          SESSION_TOKEN: ${{ steps.session.outputs.SESSION_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${SESSION_TOKEN:-}" ]]; then
            exit 0
          fi

          echo "Encerrando sessão no GLPI..."

          curl -sS --connect-timeout 5 --max-time 10 \
            -X GET \
            -H "Session-Token: ${SESSION_TOKEN}" \
            -H "App-Token: ${APP_TOKEN}" \
            "${GLPI_API_BASE%/}/killSession" >/dev/null || true
