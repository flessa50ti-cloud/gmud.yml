      - name: Criar GMUD (Change)
        shell: bash
        env:
          GLPI_API_BASE: ${{ secrets.GLPI_API_BASE }}
          GLPI_APP_TOKEN: ${{ secrets.GLPI_APP_TOKEN }}
          SESSION_TOKEN: ${{ steps.init_session.outputs.session_token }}
        run: |
          set -euo pipefail
          BASE="${GLPI_API_BASE%/}"

          echo "GLPI_API_BASE=$BASE"

          # payload com input (e status explícito)
          echo '{"input":{"name":"GMUD via GitHub Actions","content":"Deploy automático","status":1}}' > payload.json

          echo "::group::Payload"
          cat payload.json
          echo "::endgroup::"

          http_code=$(curl --connect-timeout 5 --max-time 20 -sS -o response.json -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -H "App-Token: $GLPI_APP_TOKEN" \
            -H "Session-Token: $SESSION_TOKEN" \
            -X POST --data-binary @payload.json \
            "$BASE/Change" || true)

          echo "HTTP: $http_code"
          echo "::group::Create response"
          cat response.json || true
          echo "::endgroup::"

          if [ "$http_code" != "200" ] && [ "$http_code" != "201" ]; then
            echo "::error::Falha ao criar GMUD"
            exit 1
          fi

          # Extrai ID retornado
          CHANGE_ID=$(python3 -c "import json; print(json.load(open('response.json')).get('id',''))" 2>/dev/null || true)
          if [ -z "$CHANGE_ID" ]; then
            echo "::error::Não consegui extrair o ID do Change"
            exit 1
          fi

          echo "CHANGE_ID=$CHANGE_ID"
          echo "URL para abrir (ajuste o /glpi conforme seu acesso): http://192.168.0.44/glpi/front/change.form.php?id=$CHANGE_ID"

          # Confirma que existe via API
          get_code=$(curl --connect-timeout 5 --max-time 20 -sS -o get.json -w "%{http_code}" \
            -H "App-Token: $GLPI_APP_TOKEN" \
            -H "Session-Token: $SESSION_TOKEN" \
            "$BASE/Change/$CHANGE_ID" || true)

          echo "GET HTTP: $get_code"
          echo "::group::GET Change"
          cat get.json || true
          echo "::endgroup::"

          if [ "$get_code" != "200" ]; then
            echo "::warning::Criei mas não consegui ler via API (permissão/entidade). Mesmo assim, o ID acima é a prova."
          fi
