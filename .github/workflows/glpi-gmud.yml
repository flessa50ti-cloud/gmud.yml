name: GLPI GMUD

on:
  workflow_dispatch:

jobs:
  create-gmud:
    runs-on: [self-hosted, internal]

    # ✅ Gate de aprovação (configure reviewers em Settings → Environments → production)
    environment: production

    steps:
      - name: Debug runner
        shell: bash
        run: |
          echo "HOSTNAME=$(hostname)"
          ip -br a || true

      - name: Init session (login/senha)
        id: init_session
        shell: bash
        env:
          GLPI_API_BASE: ${{ secrets.GLPI_API_BASE }}
          GLPI_APP_TOKEN: ${{ secrets.GLPI_APP_TOKEN }}
          GLPI_LOGIN: ${{ secrets.GLPI_LOGIN }}
          GLPI_PASSWORD: ${{ secrets.GLPI_PASSWORD }}
        run: |
          set -euo pipefail
          BASE="${GLPI_API_BASE%/}"

          http_code=$(curl --connect-timeout 5 --max-time 20 -sS -o init.json -w "%{http_code}" \
            -H "App-Token: $GLPI_APP_TOKEN" \
            -u "$GLPI_LOGIN:$GLPI_PASSWORD" \
            "$BASE/initSession" || true)

          echo "HTTP: $http_code"
          cat init.json || true

          if [ "$http_code" != "200" ]; then
            echo "Falha no initSession"
            exit 1
          fi

          SESSION_TOKEN=$(python3 -c "import json; print(json.load(open('init.json')).get('session_token',''))")
          if [ -z "$SESSION_TOKEN" ]; then
            echo "session_token vazio"
            exit 1
          fi

          echo "session_token=$SESSION_TOKEN" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

      - name: Criar GMUD (Change) e mostrar ID
        id: create_change
        shell: bash
        env:
          BASE: ${{ steps.init_session.outputs.base }}
          GLPI_APP_TOKEN: ${{ secrets.GLPI_APP_TOKEN }}
          SESSION_TOKEN: ${{ steps.init_session.outputs.session_token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # Conteúdo simples + rastreabilidade básica (sem quebrar YAML)
          content="Deploy automático - PRODUÇÃO\nRepo: $REPO\nRef: $REF\nCommit: $SHA\nAtor: $ACTOR\nRun: $RUN_URL\n"

          # Gera payload com Python bem curto (evita problemas com aspas/newlines)
          python3 -c "import json; \
payload={'input': {'name': 'GMUD via GitHub Actions', 'content': '''$content''', 'status': 1}}; \
json.dump(payload, open('payload.json','w',encoding='utf-8'), ensure_ascii=False)"

          http_code=$(curl --connect-timeout 5 --max-time 30 -sS -o response.json -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -H "App-Token: $GLPI_APP_TOKEN" \
            -H "Session-Token: $SESSION_TOKEN" \
            -X POST --data-binary @payload.json \
            "$BASE/Change" || true)

          echo "HTTP: $http_code"
          cat response.json || true

          if [ "$http_code" != "200" ] && [ "$http_code" != "201" ]; then
            echo "Falha ao criar GMUD"
            exit 1
          fi

          CHANGE_ID=$(python3 -c "import json; print(json.load(open('response.json')).get('id',''))" 2>/dev/null || true)
          echo "CHANGE_ID=$CHANGE_ID"
          echo "change_id=$CHANGE_ID" >> "$GITHUB_OUTPUT"

      - name: Deploy produção (placeholder)
        shell: bash
        run: |
          echo "Deploy aprovado e GMUD criada."
          echo "GMUD ID: ${{ steps.create_change.outputs.change_id }}"

      - name: Kill session
        if: always()
        shell: bash
        env:
          BASE: ${{ steps.init_session.outputs.base }}
          GLPI_APP_TOKEN: ${{ secrets.GLPI_APP_TOKEN }}
          SESSION_TOKEN: ${{ steps.init_session.outputs.session_token }}
        run: |
          curl -sS -o /dev/null \
            -H "App-Token: $GLPI_APP_TOKEN" \
            -H "Session-Token: $SESSION_TOKEN" \
            "$BASE/killSession" || true
