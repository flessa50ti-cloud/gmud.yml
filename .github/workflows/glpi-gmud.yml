name: GLPI GMUD

on:
  workflow_dispatch:

jobs:
  create-gmud:
    runs-on: [self-hosted, internal]

    steps:
      - name: Debug runner
        shell: bash
        run: |
          echo "HOSTNAME=$(hostname)"
          ip -br a || true

      - name: Init session (login/senha)
        id: init_session
        shell: bash
        env:
          GLPI_API_BASE: ${{ secrets.GLPI_API_BASE }}
          GLPI_APP_TOKEN: ${{ secrets.GLPI_APP_TOKEN }}
          GLPI_LOGIN: ${{ secrets.GLPI_LOGIN }}
          GLPI_PASSWORD: ${{ secrets.GLPI_PASSWORD }}
        run: |
          set -euo pipefail
          BASE="${GLPI_API_BASE%/}"

          http_code=$(curl -sS -o init.json -w "%{http_code}" \
            -H "App-Token: $GLPI_APP_TOKEN" \
            -u "$GLPI_LOGIN:$GLPI_PASSWORD" \
            "$BASE/initSession" || true)

          echo "HTTP: $http_code"
          cat init.json || true

          if [ "$http_code" != "200" ]; then
            echo "Falha no initSession"
            exit 1
          fi

          SESSION_TOKEN=$(python3 -c "import json; print(json.load(open('init.json')).get('session_token',''))")

          if [ -z "$SESSION_TOKEN" ]; then
            echo "session_token vazio"
            exit 1
          fi

          echo "session_token=$SESSION_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Criar GMUD (Change)
        shell: bash
        env:
          GLPI_API_BASE: ${{ secrets.GLPI_API_BASE }}
          GLPI_APP_TOKEN: ${{ secrets.GLPI_APP_TOKEN }}
          SESSION_TOKEN: ${{ steps.init_session.outputs.session_token }}
        run: |
          set -euo pipefail
          BASE="${GLPI_API_BASE%/}"

          echo '{"input":{"name":"GMUD via GitHub Actions","content":"Deploy automático","status":1}}' > payload.json

          http_code=$(curl -sS -o response.json -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -H "App-Token: $GLPI_APP_TOKEN" \
            -H "Session-Token: $SESSION_TOKEN" \
            -X POST --data-binary @payload.json \
            "$BASE/Change" || true)

          echo "HTTP: $http_code"
          cat response.json || true

          if [ "$http_code" != "200" ] && [ "$http_code" != "201" ]; then
            echo "Falha ao criar GMUD"
            exit 1
          fi
