name: GLPI GMUD (Self Hosted)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gmud:
    # AJUSTE AQUI: use labels que EXISTEM no runner correto
    runs-on: [self-hosted, glpi, lan]

    env:
      GLPI_API_BASE: ${{ secrets.GLPI_API_BASE }}
      APP_TOKEN: ${{ secrets.GLPI_APP_TOKEN }}
      USER_TOKEN: ${{ secrets.GLPI_USER_TOKEN }}
      CATEGORY_ID: ${{ secrets.GLPI_CHANGE_CATEGORY_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Prova de runner + rede
        shell: bash
        run: |
          set -euo pipefail
          echo "RUNNER_NAME=$RUNNER_NAME"
          hostname || true
          ip a || true
          ip r || true
          echo "Teste porta 80 no GLPI (192.168.0.44):"
          nc -vz -w 5 192.168.0.44 80

      - name: Mostrar GLPI_API_BASE
        shell: bash
        run: |
          set -euo pipefail
          echo "GLPI_API_BASE=${GLPI_API_BASE}"

      - name: Init GLPI Session (timeout curto)
        id: session
        shell: bash
        run: |
          set -euo pipefail

          resp=$(curl -sS --connect-timeout 5 --max-time 15 -w "\n%{http_code}" \
            -X GET \
            -H "Content-Type: application/json" \
            -H "App-Token: ${APP_TOKEN}" \
            -H "Authorization: user_token ${USER_TOKEN}" \
            "${GLPI_API_BASE%/}/initSession")

          body="$(echo "$resp" | sed '$d')"
          code="$(echo "$resp" | tail -n1)"

          echo "HTTP: $code"
          echo "Body: $body"

          session="$(echo "$body" | jq -r '.session_token // empty' 2>/dev/null || true)"

          if [[ -z "$session" ]]; then
            echo "ERRO initSession"
            exit 1
          fi

          echo "SESSION_TOKEN=$session" >> "$GITHUB_OUTPUT"
