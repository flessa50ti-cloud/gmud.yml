name: GLPI GMUD

on:
  workflow_dispatch:

jobs:
  create-gmud:
    runs-on: [self-hosted, internal]

    # ✅ Gate de aprovação (configure reviewers em Settings → Environments → production)
    environment: production

    steps:
      - name: Debug runner
        shell: bash
        run: |
          echo "HOSTNAME=$(hostname)"
          ip -br a || true

      - name: Init session (login/senha)
        id: init_session
        shell: bash
        env:
          GLPI_API_BASE: ${{ secrets.GLPI_API_BASE }}
          GLPI_APP_TOKEN: ${{ secrets.GLPI_APP_TOKEN }}
          GLPI_LOGIN: ${{ secrets.GLPI_LOGIN }}
          GLPI_PASSWORD: ${{ secrets.GLPI_PASSWORD }}
        run: |
          set -euo pipefail
          BASE="${GLPI_API_BASE%/}"

          http_code=$(curl --connect-timeout 5 --max-time 20 -sS -o init.json -w "%{http_code}" \
            -H "App-Token: $GLPI_APP_TOKEN" \
            -u "$GLPI_LOGIN:$GLPI_PASSWORD" \
            "$BASE/initSession" || true)

          echo "HTTP: $http_code"
          cat init.json || true

          if [ "$http_code" != "200" ]; then
            echo "::error::Falha no initSession"
            exit 1
          fi

          SESSION_TOKEN=$(python3 -c "import json; print(json.load(open('init.json')).get('session_token',''))" 2>/dev/null || true)

          if [ -z "$SESSION_TOKEN" ]; then
            echo "::error::session_token vazio"
            exit 1
          fi

          echo "session_token=$SESSION_TOKEN" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

      - name: Criar GMUD (Change) e mostrar ID
        id: create_change
        shell: bash
        env:
          BASE: ${{ steps.init_session.outputs.base }}
          GLPI_APP_TOKEN: ${{ secrets.GLPI_APP_TOKEN }}
          SESSION_TOKEN: ${{ steps.init_session.outputs.session_token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          export CONTENT="Deploy automático (PRODUÇÃO) | Repo=$REPO | Ref=$REF | SHA=$SHA | Ator=$ACTOR | Run=$RUN_URL"

          # Gera payload.json com JSON válido (sem risco de aspas/quebras de linha)
          python3 -c "import json,os; json.dump({'input':{'name':'GMUD via GitHub Actions','content':os.environ['CONTENT'],'status':1}}, open('payload.json','w',encoding='utf-8'), ensure_ascii=False)"

          echo "::group::Payload"
          cat payload.json || true
          echo "::endgroup::"

          http_code=$(curl --connect-timeout 5 --max-time 30 -sS -o response.json -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -H "App-Token: $GLPI_APP_TOKEN" \
            -H "Session-Token: $SESSION_TOKEN" \
            -X POST --data-binary @payload.json \
            "$BASE/Change" || true)

          echo "HTTP: $http_code"
          echo "::group::Create response"
          cat response.json || true
          echo "::endgroup::"

          if [ "$http_code" != "200" ] && [ "$http_code" != "201" ]; then
            echo "::error::Falha ao criar GMUD"
            exit 1
          fi

          # Extrai ID (funciona com id numérico e id como string)
          CHANGE_ID=$(sed -n 's/.*"id"[[:space:]]*:[[:space:]]*"\?\([0-9]\+\)"\?.*/\1/p' response.json | head -n1)

          if [ -z "$CHANGE_ID" ]; then
            echo "::error::Não consegui extrair o ID do Change"
            exit 1
          fi

          echo "CHANGE_ID=$CHANGE_ID"
          echo "change_id=$CHANGE_ID" >> "$GITHUB_OUTPUT"

      - name: Deploy produção (placeholder)
        shell: bash
        run: |
          echo "Deploy aprovado e GMUD criada."
          echo "GMUD ID: ${{ steps.create_change.outputs.change_id }}"

      - name: Kill session
        if: always()
        shell: bash
        env:
          BASE: ${{ steps.init_session.outputs.base }}
          GLPI_APP_TOKEN: ${{ secrets.GLPI_APP_TOKEN }}
          SESSION_TOKEN: ${{ steps.init_session.outputs.session_token }}
        run: |
          curl -sS -o /dev/null \
            -H "App-Token: $GLPI_APP_TOKEN" \
            -H "Session-Token: $SESSION_TOKEN" \
            "$BASE/killSession" || true
