- name: Criar GMUD no GLPI
  shell: bash
  env:
    GLPI_API_BASE: ${{ secrets.GLPI_API_BASE }}
    GLPI_APP_TOKEN: ${{ secrets.GLPI_APP_TOKEN }}
    SESSION_TOKEN: ${{ steps.init_session.outputs.session_token }}
    CHANGE_TITLE: "GMUD via GitHub Actions"
    CHANGE_DESCRIPTION: "Deploy automático realizado pelo pipeline"
  run: |
    set -euo pipefail

    BASE="${GLPI_API_BASE%/}"
    PAYLOAD_FILE="glpi_change_payload.json"

    echo "Criando payload..."

    cat > "$PAYLOAD_FILE" <<EOF
    {
      "input": {
        "name": "${CHANGE_TITLE}",
        "content": "${CHANGE_DESCRIPTION}"
      }
    }
    EOF

    echo "::group::Payload"
    cat "$PAYLOAD_FILE"
    echo "::endgroup::"

    http_code="$(curl -sS -o response.json -w "%{http_code}" \
      -H "Content-Type: application/json" \
      -H "App-Token: $GLPI_APP_TOKEN" \
      -H "Session-Token: $SESSION_TOKEN" \
      -X POST --data-binary @"$PAYLOAD_FILE" \
      "$BASE/Change" || true)"

    echo "HTTP: $http_code"
    cat response.json || true

    if [[ "$http_code" != "200" && "$http_code" != "201" ]]; then
      echo "::error::Falha ao criar GMUD"
      exit 1
    fi
