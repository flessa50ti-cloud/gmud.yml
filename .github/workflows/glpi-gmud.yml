name: GLPI - Criar GMUD (Completo)

on:
  workflow_dispatch:
    inputs:
      title:
        description: "Título da GMUD (Change)"
        required: true
        default: "GMUD - Deploy"
      description:
        description: "Descrição detalhada"
        required: true
        default: "Mudança criada automaticamente via GitHub Actions."
      impact:
        description: "Impacto (1=baixo, 2=médio, 3=alto, 4=muito alto)"
        required: true
        default: "2"
      urgency:
        description: "Urgência (1=baixa, 2=média, 3=alta, 4=muito alta)"
        required: true
        default: "2"
      priority:
        description: "Prioridade (1=baixa, 2=média, 3=alta, 4=muito alta)"
        required: true
        default: "2"
      itil_category_id:
        description: "ID da Categoria ITIL (opcional; se vazio usa secret GLPI_CHANGE_CATEGORY_ID)"
        required: false
        default: ""

jobs:
  create-gmud:
    runs-on: self-hosted

    env:
      GLPI_API_BASE: ${{ secrets.GLPI_API_BASE }}
      GLPI_APP_TOKEN: ${{ secrets.GLPI_APP_TOKEN }}
      GLPI_LOGIN: ${{ secrets.GLPI_LOGIN }}
      GLPI_PASSWORD: ${{ secrets.GLPI_PASSWORD }}
      GLPI_CHANGE_CATEGORY_ID: ${{ secrets.GLPI_CHANGE_CATEGORY_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate and normalize API base
        id: norm
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${GLPI_API_BASE:-}" ]] || { echo "::error::Falta secret GLPI_API_BASE"; exit 2; }
          [[ -n "${GLPI_APP_TOKEN:-}" ]] || { echo "::error::Falta secret GLPI_APP_TOKEN"; exit 2; }
          [[ -n "${GLPI_LOGIN:-}" ]] || { echo "::error::Falta secret GLPI_LOGIN"; exit 2; }
          [[ -n "${GLPI_PASSWORD:-}" ]] || { echo "::error::Falta secret GLPI_PASSWORD"; exit 2; }

          BASE="$(printf '%s' "$GLPI_API_BASE" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [[ ! "$BASE" =~ ^https?:// ]]; then
            echo "::error::GLPI_API_BASE inválida. Ex: http://192.168.0.44/glpi/apirest.php"
            exit 2
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

      - name: Init session (Basic Auth)
        id: init
        shell: bash
        env:
          BASE: ${{ steps.norm.outputs.base }}
        run: |
          set -euo pipefail

          BASIC="$(python3 - <<'PY'
import base64, os
u=os.environ["GLPI_LOGIN"]
p=os.environ["GLPI_PASSWORD"]
print(base64.b64encode(f"{u}:{p}".encode()).decode())
PY
)"
          http_code="$(curl -sS -o glpi_init_session.json -w "%{http_code}"             -H "Content-Type: application/json"             -H "App-Token: $GLPI_APP_TOKEN"             -H "Authorization: Basic $BASIC"             "$BASE/initSession")"

          echo "::group::InitSession response"
          echo "HTTP: $http_code"
          cat glpi_init_session.json || true
          echo "::endgroup::"

          [[ "$http_code" == "200" ]] || { echo "::error::Falha ao iniciar sessão no GLPI"; exit 1; }

          SESSION_TOKEN="$(python3 - <<'PY'
import json
with open("glpi_init_session.json",encoding="utf-8") as f:
    print(json.load(f).get("session_token",""))
PY
)"
          [[ -n "$SESSION_TOKEN" ]] || { echo "::error::Sem session_token"; exit 1; }
          echo "session_token=$SESSION_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Build payload
        shell: bash
        env:
          TITLE: ${{ inputs.title }}
          DESC: ${{ inputs.description }}
          IMPACT: ${{ inputs.impact }}
          URGENCY: ${{ inputs.urgency }}
          PRIORITY: ${{ inputs.priority }}
          ITIL_INPUT: ${{ inputs.itil_category_id }}
        run: |
          set -euo pipefail

          ITIL="${ITIL_INPUT:-}"
          if [[ -z "$ITIL" ]]; then
            ITIL="${GLPI_CHANGE_CATEGORY_ID:-}"
          fi
          export ITIL

          cat > build_payload.py <<'PY'
import json, os

title=os.environ["TITLE"]
desc=os.environ["DESC"]
impact=int(os.environ["IMPACT"])
urgency=int(os.environ["URGENCY"])
priority=int(os.environ["PRIORITY"])
itil=os.environ.get("ITIL","").strip()

payload={"input":{
  "name": title,
  "content": desc,
  "impact": impact,
  "urgency": urgency,
  "priority": priority
}}
if itil:
  try:
    payload["input"]["itilcategories_id"]=int(itil)
  except:
    payload["input"]["itilcategories_id"]=itil

with open("glpi_change_payload.json","w",encoding="utf-8") as f:
  json.dump(payload,f,ensure_ascii=False,indent=2)

print(json.dumps(payload,ensure_ascii=False,indent=2))
PY

          python3 build_payload.py

      - name: Create Change (GMUD)
        id: create
        shell: bash
        env:
          BASE: ${{ steps.norm.outputs.base }}
          SESSION_TOKEN: ${{ steps.init.outputs.session_token }}
        run: |
          set -euo pipefail

          http_code="$(curl -sS -o glpi_change_create_response.json -w "%{http_code}"             -H "Content-Type: application/json"             -H "App-Token: $GLPI_APP_TOKEN"             -H "Session-Token: $SESSION_TOKEN"             -X POST --data-binary @glpi_change_payload.json             "$BASE/Change")"

          echo "::group::Create Change response"
          echo "HTTP: $http_code"
          cat glpi_change_create_response.json || true
          echo "::endgroup::"

          [[ "$http_code" == "200" || "$http_code" == "201" ]] || { echo "::error::Falha ao criar GMUD"; exit 1; }

          CHANGE_ID="$(python3 - <<'PY'
import json
with open("glpi_change_create_response.json",encoding="utf-8") as f:
    print(json.load(f).get("id",""))
PY
)"
          [[ -n "$CHANGE_ID" ]] || { echo "::error::Não consegui extrair o ID"; exit 1; }
          echo "change_id=$CHANGE_ID" >> "$GITHUB_OUTPUT"

      - name: Validate Change exists (GET)
        shell: bash
        env:
          BASE: ${{ steps.norm.outputs.base }}
          SESSION_TOKEN: ${{ steps.init.outputs.session_token }}
          CHANGE_ID: ${{ steps.create.outputs.change_id }}
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3; do
            http_code="$(curl -sS -o glpi_change_get_response.json -w "%{http_code}"               -H "Content-Type: application/json"               -H "App-Token: $GLPI_APP_TOKEN"               -H "Session-Token: $SESSION_TOKEN"               "$BASE/Change/$CHANGE_ID")"
            echo "Attempt $attempt HTTP=$http_code"
            if [[ "$http_code" == "200" ]]; then ok=1; break; fi
            sleep $((attempt * 2))
          done
          [[ "$ok" -eq 1 ]] || { echo "::error::Validação falhou (GET não retornou 200)"; exit 1; }

      - name: Kill session
        if: always()
        shell: bash
        env:
          BASE: ${{ steps.norm.outputs.base }}
          SESSION_TOKEN: ${{ steps.init.outputs.session_token }}
        run: |
          set -euo pipefail
          [[ -n "${SESSION_TOKEN:-}" ]] || exit 0
          curl -sS -o /dev/null -w "killSession HTTP:%{http_code}\n"             -H "Content-Type: application/json"             -H "App-Token: $GLPI_APP_TOKEN"             -H "Session-Token: $SESSION_TOKEN"             "$BASE/killSession" || true

      - name: Write summary
        if: always()
        shell: bash
        env:
          BASE: ${{ steps.norm.outputs.base }}
          CHANGE_ID: ${{ steps.create.outputs.change_id }}
        run: |
          {
            echo "## Resultado - GMUD (GLPI)"
            echo ""
            if [[ -n "${CHANGE_ID:-}" ]]; then
              echo "- **Change ID:** \`${CHANGE_ID}\`"
              echo "- **GET:** \`${BASE}/Change/${CHANGE_ID}\`"
            else
              echo "- **Change ID:** (não disponível)"
            fi
            echo ""
            echo "Artifacts: **glpi-api-responses**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload API responses (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glpi-api-responses
          path: |
            glpi_init_session.json
            glpi_change_payload.json
            glpi_change_create_response.json
            glpi_change_get_response.json
          if-no-files-found: ignore
